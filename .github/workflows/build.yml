name: Build and push

# The upstream release this image vendors. Bumping it is the only edit needed
# to ship a new server version — the image tag follows it.
env:
  DS_VERSION: v0.3.0
  IMAGE: iinitz/durable-streams-server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ds_version:
        description: 'Upstream release tag to vendor (e.g. v0.3.0)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          VERSION="${{ github.event.inputs.ds_version || env.DS_VERSION }}"
          echo "ds_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # arm64 is emulated on the amd64 runner; the build only downloads and
      # unpacks a static binary, so this stays cheap.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Two tags, no `latest`: this image holds data, so a rollback has to be
      # able to name the exact build it is going back to. `<version>` moves when
      # the image is rebuilt; `<version>-<run>` never does.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DS_VERSION=${{ steps.v.outputs.ds_version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
